# One nginx, several websites. nginx looks at the PATH of each request (/course/,
# /client/, /api/, ...) and forwards it to the matching container. Everything lives on
# one address (whatever host name or IP reaches this machine): no extra names or /etc/hosts.

# Accept HTTP/2 (needed for gRPC) next to HTTP/1.1 on port 80. On a plain-HTTP port nginx
# decides this per port, before it has read the request, so it's set for the whole port.
http2 on;

# Docker's built-in DNS server (inside every container on a compose network). nginx needs it
# for names it looks up while running, instead of once at startup: the Kubernetes and Swarm
# containers below. valid=10s: remember an answer for at most 10 s, so a recreated container
# (new IP) is found quickly. resolver_timeout 5s: after a failed lookup (container not there),
# try again after 5 s instead of the default 30, so a node that comes back gets traffic sooner.
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

# The Docker Swarm (chapter 12). `docker compose run --rm swarm up` attaches all three nodes to
# our frontend network. Thanks to the routing mesh, port 80 on ANY node reaches the service, so
# list them all: if one node goes down, nginx sends requests to the others.
# "resolve" looks the names up while running (like the variable for k8s below, for a whole
# group), and needs a shared memory "zone".
upstream swarm_nodes {
    zone swarm_nodes 64k;
    server swarm-manager:80  resolve;
    server swarm-worker-1:80 resolve;
    server swarm-worker-2:80 resolve;
}

server {
    listen 80;

    # nginx's own redirects (e.g. /client → /client/) get a *relative* Location header,
    # so the browser keeps the :8080 it came in on (nginx itself only knows port 80).
    absolute_redirect off;

    # "location /course/ { proxy_pass http://course:80/; }": the trailing / on proxy_pass
    # replaces the matched /course/ with /, so the course container sees /lessons/... and
    # never knows about the prefix.
    location /course/ {
        proxy_pass http://course:80/;
        # The course's own nginx redirects /lessons/x to /lessons/x/; put /course back in front.
        proxy_redirect / /course/;
        proxy_set_header Host $http_host;   # $http_host keeps the :8080 port
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The client also loses its /client prefix on the way in. X-Forwarded-Prefix tells Laravel
    # about it, so route() and redirects build /client/... links (see client/src/bootstrap/app.php).
    location /client/ {
        proxy_pass http://client:8000/;
        proxy_set_header Host $http_host;   # $http_host keeps the :8080 port, so Laravel redirects work
        proxy_set_header X-Forwarded-Prefix /client;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The api's routes already start with /api (and /graphql, /graphiql), so here the path is
    # passed on unchanged: no URI after the host in proxy_pass.
    location ~ ^/(api/|graphql$|graphiql$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;   # $http_host keeps the :8080 port, so Laravel redirects work
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gRPC runs over HTTP/2 and uses grpc_pass instead of proxy_pass.
    # A gRPC call is a POST to /<package>.<Service>/<Method>, and clients always send that exact
    # path: there's no way to put it under a prefix like /grpc/. So match the service names:
    # the books service and the reflection service (which tools use to list the methods).
    # Browsers can't speak raw gRPC; use grpcurl or Postman on the proxy's address, plaintext.
    location ~ ^/(books\.v1\.|grpc\.reflection\.) {
        grpc_pass grpc://grpc:50051;
    }

    # The documented Flask REST API (chapter 13). Swagger UI at /flask/apidocs/.
    # Like the client: prefix stripped here, announced in X-Forwarded-Prefix (see flask/app.py).
    location /flask/ {
        proxy_pass http://flask:5000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Prefix /flask;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MQTT over WebSockets for the browser: ws://<proxy address>/mqtt. A WebSocket starts as a
    # normal HTTP request that asks to "Upgrade"; these headers pass that request on to the broker.
    location = /mqtt {
        proxy_pass http://mqtt:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;   # keep idle connections open; MQTT sends its own keep-alives
    }

    # gRPC wrapped in WebSockets for the browser (the client's gRPC page). A WebSocket is plain
    # HTTP/1.1 at the start, so it also passes proxies that break real gRPC, like Cloudflare Tunnel.
    location = /grpc-ws {
        proxy_pass http://grpc-ws:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Genuine gRPC (the raw HTTP/2 bytes) wrapped in a WebSocket, for Postman or grpcurl behind a
    # local wrapper like websocat. websockify unwraps it and passes the bytes on to grpc unchanged.
    location = /grpc-tunnel {
        proxy_pass http://grpc-tunnel:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;   # long streams and idle Postman connections
    }

    # The Kubernetes cluster (chapter 11). It isn't part of this compose project, and often isn't
    # running: `docker compose run --rm k8s up` attaches k3d's load balancer to our frontend network.
    #
    # The address is in a VARIABLE on purpose. A plain "proxy_pass http://k3d-lab-serverlb;" is
    # looked up once, at startup, and nginx refuses to start (taking the whole lab down) when the
    # cluster doesn't exist. A variable is looked up per request, via the resolver above:
    # no cluster = a 502 on this path only.
    # With a variable, proxy_pass can't strip the prefix for us, so rewrite does it.
    location /k8s/ {
        set $k8s k3d-lab-serverlb:80;
        rewrite ^/k8s/(.*)$ /$1 break;
        proxy_pass http://$k8s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The Docker Swarm (chapter 12), via the upstream group at the top of this file.
    location /swarm/ {
        proxy_pass http://swarm_nodes/;
        # A stopped node doesn't answer at all. Give up after 2 s (instead of 60) and retry
        # the request on the next node, so visitors only notice a short delay.
        proxy_connect_timeout 2s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Adminer only uses relative links (?server=db&...), so it works under a prefix as is.
    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Any other path (e.g. just the address, with nothing after it) gets a short signpost.
    # $http_host is the host and port the visitor typed, so the links match their address.
    location / {
        default_type text/plain;
        return 200 "Docker Laravel API lab\n\n  http://$http_host/course/   the course: lessons, exercises, reference\n  http://$http_host/client/   website consuming the API\n  http://$http_host/api/books   the REST API\n  http://$http_host/graphiql   GraphQL explorer\n  http://$http_host/api/soap?wsdl   SOAP contract\n  $http_host   gRPC (grpcurl/Postman, plaintext; not through Cloudflare, use /grpc-tunnel there)\n  http://$http_host/flask/apidocs/   documented Flask REST API (Swagger UI)\n  ws://$http_host/mqtt   MQTT over WebSockets\n  ws://$http_host/grpc-ws   gRPC over WebSockets (for the browser)\n  ws://$http_host/grpc-tunnel   genuine gRPC wrapped in WebSockets (websocat + Postman; wss:// behind Cloudflare)\n  http://$http_host/k8s/   Kubernetes whoami page (after: docker compose run --rm k8s up)\n  http://$http_host/swarm/   Swarm whoami page (after: docker compose run --rm swarm up)\n  http://$http_host/adminer/   database UI (server: db)\n";
    }
    location /security/{
        set $security threatmodel:8000;
        rewrite ^/security/(.*)$ /$1 break;
        proxy_pass http://$security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
