# Mosquitto, the MQTT broker. Publishers send messages to it, subscribers receive them from it.
# Publishers and subscribers never talk to each other directly, and don't need to know about each other.

# Plain MQTT, for services inside the Docker network (api, listener).
listener 1883
protocol mqtt

# MQTT over WebSockets, for browsers (they can't open raw TCP connections).
# The proxy forwards ws://<proxy address>/mqtt here.
listener 9001
protocol websockets

# Lab setting: anyone may connect without a username. See the exercises for adding passwords.
allow_anonymous true

# Keep retained messages and queued QoS 1 messages across restarts (stored in the mqttdata volume).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe
